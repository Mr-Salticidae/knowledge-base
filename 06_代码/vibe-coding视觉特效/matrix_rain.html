<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Rain - 数字雨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; }
  .title {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(0,255,80,0.15); font: 300 28px 'Segoe UI', sans-serif;
    pointer-events: none; letter-spacing: 8px; text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Matrix Rain</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, columns, drops;
const fontSize = 16;
// 混合字符：日文片假名 + 数字 + 符号
const chars = 'アァカサタナハマヤラワガザダバパイィキシチニヒミリギジヂビピウゥクスツヌフムユルグズヅブプエェケセテネヘメレゲゼデベペオォコソトノホモヨロゴゾドボポヴッン0123456789ABCDEF<>{}[]/\\|*+=$#@';

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  columns = Math.floor(W / fontSize);
  drops = Array(columns).fill(0).map(() => Math.random() * -100);
}
resize();
window.addEventListener('resize', resize);

let mouseX = -1, mouseY = -1;
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

function draw() {
  // 拖尾
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, W, H);

  ctx.font = fontSize + 'px monospace';

  for (let i = 0; i < drops.length; i++) {
    const char = chars[Math.floor(Math.random() * chars.length)];
    const x = i * fontSize;
    const y = drops[i] * fontSize;

    // 头部白色高亮
    if (Math.random() > 0.975) {
      ctx.fillStyle = '#fff';
      ctx.fillText(char, x, y);
    } else {
      // 渐变绿色 — 头部亮，尾部暗
      const distFromMouse = mouseX >= 0
        ? Math.sqrt((x - mouseX) ** 2 + (y - mouseY) ** 2)
        : 999;
      const proximity = Math.max(0, 1 - distFromMouse / 200);

      if (proximity > 0) {
        // 鼠标附近变青色
        ctx.fillStyle = `rgba(${100 + proximity * 155}, 255, ${200 + proximity * 55}, ${0.8 + proximity * 0.2})`;
      } else {
        ctx.fillStyle = `rgba(0, 255, 80, 0.85)`;
      }
      ctx.fillText(char, x, y);
    }

    if (y > H && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
